name: "Push sources and translations to Crowdin (Mobile)"

# This overwrites Crowdin sources and translations from the selected branch.
# To avoid losing Crowdin changes:
# 1. Run the normal sync and merge its translation PR.
# 2. Branch from updated main, then edit and push the strings.
# 3. Run this workflow on that branch, then merge the edit PR.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    push-sources-and-translations-to-crowdin:
        name: "Push mobile sources and translations"
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Crowdin push
              uses: crowdin/github-action@52aa776766211d83d975df51f3b9c53c2f8ba35f # v2.16.3
              with:
                  base_path: mobile/packages/strings/
                  config: mobile/packages/strings/crowdin.yml
                  upload_sources: true
                  upload_translations: true
                  auto_approve_imported: false
                  import_eq_suggestions: true
                  download_translations: false
                  project_id: 574741
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
