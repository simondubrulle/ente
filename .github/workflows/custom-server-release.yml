name: "Release (Server)"

on:
  workflow_run:
    workflows: ["Sync fork and create tag"]
    types:
      - completed
  workflow_dispatch: # Retains manual trigger capability

permissions:
  contents: read
  packages: write # Required to push to GitHub Container Registry (ghcr.io)

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/museum-prod:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/museum-prod:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
