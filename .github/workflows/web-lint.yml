name: "Lint (Web)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: rust-wasm
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: rust-wasm

            - name: Restore web cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: web-${{ github.sha }}
                  restore-keys: web-
                  path: |
                      web/apps/photos/.next/cache
                      web/apps/*/*.tsbuildinfo
                      web/packages/*/*.tsbuildinfo
                      web/packages/wasm/*/*.tsbuildinfo

            - run: npm ci

            - run: npm audit --audit-level critical

            - run: _ENTE_IS_DESKTOP=1 npm run build:photos

            - run: npm run build:wasm

            - run: node scripts/lint.mjs

            - run: npm test
